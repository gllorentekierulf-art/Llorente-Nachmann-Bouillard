<!DOCTYPE html>
<html lang="es">
<head>
     <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NorImports</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <header>
    <div class="grupo-logo">
        <a href="./index.html"><img src="./img/logo.png" alt="" class="logo"></a>
    </div>
    <nav class="menu-rapido">
        <a href="./index.html"><h1>NorImports</h1></a>
        <ul class="menu-login">
            <li><a href="./index.html">Home</a></li>
            <li class="item-login"><a href="./login.html">Login</a></li>
            <li class="item-registro"><a href="./register.html">Register</a></li>
            <li class="item-saludo"></li>
            <li class="item-logout"><a class="link-logout" href="./index.html">logout</a></li>
        </ul>

        <form class="buscador" action="./search-results.html" method="GET">
            <input type="search" name="buscar" class="campo-buscar">
            <button type="submit">Buscar</button>
            <p class="error-buscador"></p>
        </form>
    </nav>
</header>
       <div class="layout">
        <aside>
      <nav>
                <ul class="lista"></ul>
            </nav>
            </aside>
            <div class="form-container">
                <form class="form-registro" action="./login.html" method="GET">
    <input type="email" name="email" class="campo-email" placeholder="Email">
    <p class="error-email"></p>
    <input type="password" name="password" class="campo-password" placeholder="Contraseña">
    <p class="error-password"></p>
    <input type="password" name="repetir-password" class="campo-repetir" placeholder="Repetir contraseña">
    <p class="error-repetir"></p>
    <input type="checkbox" name="terminos"> <span>Acepto términos y condiciones</span>
    <button type="submit">Registrarme</button>
    <a href="./login.html">Ya tengo una cuenta</a>
                </form>
            </div>
              </div>
                <footer>
        <p>Llorente - Nachmann - Bouillard</p>
    </footer>

    <script src="./js/buscador.js"></script>
<script src="./js/categorias.js"></script>
<script src="./js/saludo.js"></script>
<script src="./js/logout.js"></script>
<script src="./js/register.js"></script>

</body>
</html>
